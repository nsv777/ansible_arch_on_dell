---
- name: Common part
  hosts: all
  tags: common
  roles:
    - role: create_aur_user
    - role: common_utilities
      tags: common_utilities
    - role: docker
      become: true
      tags: docker
    - role: users
      become: true
      tags: users
    - role: locale
    - role: configure_pacman
      tags: configure_pacman
    - role: sudoers
    - role: systemd
    - role: install_yay
      tags: yay
    - role: paccache
    - role: vim

- name: laptop part
  hosts: laptop
  tags: laptop
  roles:
    - role: kubeseal
      tags: kubeseal
    - role: intel_driver
      become: true
      tags: intel_driver
    - role: ly
      become: true
      tags: ly
    - role: geany
      tags: geany
    - role: zed
      tags: zed
    - role: deadbeef
    - role: wallpaper_changer
      tags: wallpaper_changer
    - role: laptop_utilities
      tags: laptop_utilities
    - role: tenv
      become: true
      tags: tenv
    - role: firefox
      tags: firefox
    - role: insomnia
      tags: insomnia
    - role: yazi
      become: true
      tags: yazi
    - role: strata
      tags: strata
    - role: hyprland
      tags: hyprland
    - role: mountpoints
      become: true
      tags: mountpoints

- name: Configure ip forward
  hosts: laptop
  become: true
  roles:
    - role: sysctl_ip_forward
      tags: sysctl_ip_forward
