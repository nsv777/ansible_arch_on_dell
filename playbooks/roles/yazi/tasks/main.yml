---
- name: Verify yazi supports the operating system
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] in ["Archlinux", "Ubuntu"]
    fail_msg: >-
      The yazi role supports Arch Linux and Ubuntu only, not
      {{ ansible_facts["distribution"] }}.

- name: Install yazi for the operating system
  ansible.builtin.include_tasks:
    file: "{{ ansible_facts['distribution'] | lower }}.yml"
