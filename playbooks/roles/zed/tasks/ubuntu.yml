---
- name: Remove paid zed apt repository
  ansible.builtin.deb822_repository:
    name: deb-griffo-io
    state: absent
  become: true

- name: Add zed apt repository (always-free mirror)
  ansible.builtin.deb822_repository:
    name: deb-free-griffo-io
    types:
      - deb
    uris:
      - https://deb-free.griffo.io/apt
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - main
    signed_by: https://deb-free.griffo.io/EA0F721D231FDD3A0A17B9AC7808B4DD62C41256.asc
    state: present
  notify: update_apt_package_cache
  become: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Install zed
  ansible.builtin.apt:
    name: zed
    state: present
  become: true
