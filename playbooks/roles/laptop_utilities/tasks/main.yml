---
- name: Install packages
  ansible.builtin.include_role:
    name: install_packages
    vars_from: "{{ role_name }}"

- name: Copy chromium config
  ansible.builtin.copy:
    src: config/chromium-flags.conf
    dest: "$HOME/.config"
    mode: "0644"

- name: Copy udev rules for Keychron/STM devices
  ansible.builtin.copy:
    src: udev/50-keychron.rules
    dest: "/etc/udev/rules.d/50-keychron.rules"
    mode: "0644"
  become: true
  notify: reload_udev_rules

- name: flush_handlers
  ansible.builtin.meta: flush_handlers
