---
- name: Install printing packages
  ansible.builtin.package:
    name: "{{ lookup('vars', 'printing_packages_' ~ (ansible_facts['distribution'] | lower)) }}"
    state: present
  become: true

- name: Enable and start the cups service
  ansible.builtin.systemd_service:
    name: cups.service
    enabled: true
    state: started

- name: Enable and start the avahi-daemon service
  ansible.builtin.systemd_service:
    name: avahi-daemon.service
    enabled: true
    state: started

- name: Get groups
  ansible.builtin.getent:
    database: group

- name: Get users
  ansible.builtin.getent:
    database: passwd

- name: Initialize printing group members
  ansible.builtin.set_fact:
    printing_group_members: []

- name: Collect members of users and wheel groups
  ansible.builtin.set_fact:
    printing_group_members: >-
      {{ printing_group_members | default([])
         + (item.value[2] | default('') | split(',') | map('trim') | reject('equalto', '') | list)
         + (ansible_facts.getent_passwd | dict2items | selectattr('value.2', 'equalto', item.value[1])
            | map(attribute='key') | list) }}
  loop: "{{ ansible_facts.getent_group | dict2items | selectattr('key', 'in', ['users', 'wheel']) | selectattr('value', 'ne', none) | list }}"
  loop_control:
    label: "{{ item.key }}"

- name: Add group members to lp group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: lp
    append: true
  become: true
  loop: "{{ printing_group_members | unique | select('in', ansible_facts.getent_passwd.keys() | list) | list }}"
