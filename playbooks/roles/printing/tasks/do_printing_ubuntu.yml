---
- name: Install packages
  ansible.builtin.apt:
    name: "{{ install_packages_ubuntu.apt }}"
    state: present
    update_cache: true
  become: true
  tags: [install]

- name: Enable and start the cups service
  ansible.builtin.systemd_service:
    name: cups.service
    enabled: true
    started: true

- name: Enable and start the avahi-daemon service
  ansible.builtin.systemd_service:
    name: avahi-daemon.service
    enabled: true
    started: true
