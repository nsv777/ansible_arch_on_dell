---
- name: Install docker
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] | lower }}.yml"

- name: Gather mcp Docker network information
  community.docker.docker_network_info:
    name: mcp-network
  register: docker_mcp_network

- name: Create mcp Docker network
  community.docker.docker_network:
    name: mcp-network
    driver: bridge
    driver_options:
      com.docker.network.driver.mtu: "1400"
    force: "{{ docker_mcp_network.exists and (docker_mcp_network.network.Options['com.docker.network.driver.mtu'] | default('') != '1400') }}"
