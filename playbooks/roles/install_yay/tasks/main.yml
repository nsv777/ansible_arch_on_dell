---
- name: Install required packages
  community.general.pacman:
    name:
      - fakeroot
      - base-devel
  become: true

- name: "makepkg: disable debug packages"
  ansible.builtin.copy:
    src: disable_debug.conf
    dest: /etc/makepkg.conf.d/
    mode: "0644"
    owner: root
  become: true

- name: Install yay
  kewlfft.aur.aur:
    name: yay
    use: makepkg
  become: true
  become_user: "{{ aur_user }}"

- name: run setup once again
  ansible.builtin.setup:

- name: "yay: configure defaults"
  ansible.builtin.copy:
    src: yay_config.json
    dest: "{{ ansible_facts['user_dir'] }}/.config/yay/config.json"
    mode: "0644"
