---
- name: Verify Insomnia supports the operating system
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] in ["Archlinux", "Ubuntu"]
    fail_msg: >-
      The Insomnia role supports Arch Linux and Ubuntu only, not
      {{ ansible_facts["distribution"] }}.

- name: Install Insomnia for the operating system
  ansible.builtin.include_tasks:
    file: "{{ ansible_facts['distribution'] | lower }}.yml"
