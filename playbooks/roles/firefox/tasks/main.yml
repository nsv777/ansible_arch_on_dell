---
- name: Install firefox
  ansible.builtin.include_tasks:
    file: "do_install_firefox_{{ ansible_facts['distribution'] | lower }}.yml"

- name: Create .config/environment.d dir
  ansible.builtin.file:
    path: "$HOME/.config/environment.d"
    state: directory
    mode: "0755"

- name: Copy firefox env config
  ansible.builtin.copy:
    src: config/environment.d/firefox.conf
    dest: "$HOME/.config/environment.d"
    mode: "0644"
