---
- name: Verify strata supports the operating system
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] in ["Archlinux", "Ubuntu"]
    fail_msg: >-
      The strata role supports Arch Linux and Ubuntu only, not
      {{ ansible_facts["distribution"] }}.

- name: Verify strata supports the architecture
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in strata_arch_targets
    fail_msg: >-
      Strata has no prebuilt release for {{ ansible_facts["architecture"] }}.

- name: Determine strata release target
  ansible.builtin.set_fact:
    strata_target: "{{ strata_arch_targets[ansible_facts['architecture']] }}"

- name: Gather the current user's home directory
  ansible.builtin.setup:
    filter: ansible_user_dir

- name: Install strata dependencies for the operating system
  ansible.builtin.include_tasks:
    file: "{{ ansible_facts['distribution'] | lower }}.yml"

- name: Gather installed package versions
  ansible.builtin.package_facts:
    manager: auto

- name: Create strata directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.cache/strata"
    - "{{ ansible_facts['user_dir'] }}/.local/share/applications"
    - "{{ ansible_facts['user_dir'] }}/.local/share/dbus-1/services"
    - "{{ ansible_facts['user_dir'] }}/.local/share/icons/hicolor/scalable/apps"
    - "{{ ansible_facts['user_dir'] }}/.config/strata"

- name: Create bin directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin"
    state: directory
    mode: "0700"

- name: Download strata release archive
  ansible.builtin.get_url:
    url: "https://github.com/lgse/strata/releases/download/v{{ strata_version }}/strata-{{ strata_version }}-{{ strata_target }}.tar.gz"
    dest: "{{ ansible_facts['user_dir'] }}/.cache/strata/strata-{{ strata_version }}-{{ strata_target }}.tar.gz"
    checksum: "{{ strata_checksums[ansible_facts['architecture']] }}"
    mode: "0644"

- name: Extract strata release archive
  ansible.builtin.unarchive:
    src: "{{ ansible_facts['user_dir'] }}/.cache/strata/strata-{{ strata_version }}-{{ strata_target }}.tar.gz"
    dest: "{{ ansible_facts['user_dir'] }}/.cache/strata"
    remote_src: true
    creates: "{{ ansible_facts['user_dir'] }}/.cache/strata/strata-{{ strata_version }}-{{ strata_target }}/strata"

- name: Install strata binary
  ansible.builtin.copy:
    src: "{{ ansible_facts['user_dir'] }}/.cache/strata/strata-{{ strata_version }}-{{ strata_target }}/strata"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/strata"
    mode: "0755"
    remote_src: true

- name: Install strata application icon
  ansible.builtin.copy:
    src: "{{ ansible_facts['user_dir'] }}/.cache/strata/strata-{{ strata_version }}-{{ strata_target }}/io.github.lgse.Strata.svg"
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/icons/hicolor/scalable/apps/io.github.lgse.Strata.svg"
    mode: "0644"
    remote_src: true

- name: Install system portal metadata for xdg-desktop-portal before 1.20.1
  ansible.builtin.copy:
    src: "{{ ansible_facts['user_dir'] }}/.cache/strata/strata-{{ strata_version }}-{{ strata_target }}/portal/strata.portal"
    dest: /usr/share/xdg-desktop-portal/portals/strata.portal
    mode: "0644"
    remote_src: true
  become: true
  when: >-
    ansible_facts.packages["xdg-desktop-portal"][0].version
    is version("1.20.1", "<", version_type="loose")

- name: Record system portal metadata as role-managed
  ansible.builtin.copy:
    content: managed by the strata role
    dest: /usr/share/xdg-desktop-portal/portals/.strata.portal.ansible_arch_on_dell
    mode: "0644"
  become: true
  when: >-
    ansible_facts.packages["xdg-desktop-portal"][0].version
    is version("1.20.1", "<", version_type="loose")

- name: Check for role-managed system portal metadata
  ansible.builtin.stat:
    path: /usr/share/xdg-desktop-portal/portals/.strata.portal.ansible_arch_on_dell
  register: strata_system_portal_marker

- name: Remove obsolete role-managed system portal metadata
  ansible.builtin.file:
    path: /usr/share/xdg-desktop-portal/portals/strata.portal
    state: absent
  become: true
  when:
    - >-
      ansible_facts.packages["xdg-desktop-portal"][0].version
      is version("1.20.1", ">=", version_type="loose")
    - strata_system_portal_marker.stat.exists

- name: Remove obsolete system portal metadata marker
  ansible.builtin.file:
    path: /usr/share/xdg-desktop-portal/portals/.strata.portal.ansible_arch_on_dell
    state: absent
  become: true
  when:
    - >-
      ansible_facts.packages["xdg-desktop-portal"][0].version
      is version("1.20.1", ">=", version_type="loose")
    - strata_system_portal_marker.stat.exists

- name: Install strata desktop entry
  ansible.builtin.template:
    src: io.github.lgse.Strata.desktop.j2
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/applications/io.github.lgse.Strata.desktop"
    mode: "0644"

- name: Install strata settings
  ansible.builtin.template:
    src: settings.toml.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/strata/settings.toml"
    mode: "0600"

- name: Find conflicting FileManager1 services
  ansible.builtin.find:
    paths: "{{ ansible_facts['user_dir'] }}/.local/share/dbus-1/services"
    patterns: "*.service"
    contains: "Name=org.freedesktop.FileManager1"
  register: strata_conflicting_services

- name: Remove conflicting FileManager1 services
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ strata_conflicting_services.files }}"
  when: item.path | basename != "io.github.lgse.Strata.FileManager1.service"

- name: Install strata FileManager1 service
  ansible.builtin.template:
    src: io.github.lgse.Strata.FileManager1.service.j2
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/dbus-1/services/io.github.lgse.Strata.FileManager1.service"
    mode: "0644"

- name: Install strata as the system file chooser
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/.local/bin/strata --install-portal"
    creates: "{{ ansible_facts['user_dir'] }}/.local/share/strata/portal-install/state.toml"
  changed_when: false

- name: Read strata portal installation state
  ansible.builtin.slurp:
    src: "{{ ansible_facts['user_dir'] }}/.local/share/strata/portal-install/state.toml"
  register: strata_portal_install_state

- name: Determine strata portal configuration
  ansible.builtin.set_fact:
    strata_portal_config_name: >-
      {{
        strata_portal_install_state.content
        | b64decode
        | regex_findall('(?m)^target_name = "([^"]+)"$')
        | first
      }}

- name: Use only strata for FileChooser with xdg-desktop-portal before 1.19
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.config/xdg-desktop-portal/{{ strata_portal_config_name }}"
    regexp: '^org\.freedesktop\.impl\.portal\.FileChooser='
    line: org.freedesktop.impl.portal.FileChooser=strata;
    mode: "0600"
  register: strata_legacy_portal_config
  when: >-
    ansible_facts.packages["xdg-desktop-portal"][0].version
    is version("1.19", "<", version_type="loose")

- name: Restart xdg-desktop-portal after legacy preference change
  ansible.builtin.systemd_service:
    name: xdg-desktop-portal.service
    scope: user
    state: restarted
  when:
    - strata_legacy_portal_config is not skipped
    - strata_legacy_portal_config is changed

- name: Record legacy FileChooser override
  ansible.builtin.copy:
    content: managed by the strata role
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/strata/portal-install/ansible-legacy-file-chooser"
    mode: "0600"
  when: >-
    ansible_facts.packages["xdg-desktop-portal"][0].version
    is version("1.19", "<", version_type="loose")

- name: Check for legacy FileChooser override
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/strata/portal-install/ansible-legacy-file-chooser"
  register: strata_legacy_portal_marker

- name: Restore strata FileChooser fallbacks after xdg-desktop-portal upgrade
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/.local/bin/strata --install-portal"
  changed_when: true
  when:
    - >-
      ansible_facts.packages["xdg-desktop-portal"][0].version
      is version("1.19", ">=", version_type="loose")
    - strata_legacy_portal_marker.stat.exists

- name: Remove legacy FileChooser override marker
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/strata/portal-install/ansible-legacy-file-chooser"
    state: absent
  when:
    - >-
      ansible_facts.packages["xdg-desktop-portal"][0].version
      is version("1.19", ">=", version_type="loose")
    - strata_legacy_portal_marker.stat.exists

- name: Update desktop database
  ansible.builtin.command:
    cmd: "update-desktop-database {{ ansible_facts['user_dir'] }}/.local/share/applications"
  changed_when: false

- name: Update icon cache
  ansible.builtin.command:
    cmd: "gtk-update-icon-cache -qtf {{ ansible_facts['user_dir'] }}/.local/share/icons/hicolor"
  changed_when: false
  failed_when: false

- name: Set strata as default directory handler
  ansible.builtin.command:
    cmd: "xdg-mime default io.github.lgse.Strata.desktop inode/directory"
  changed_when: false
