---
- name: Get latest kubeseal release
  ansible.builtin.uri:
    url: https://api.github.com/repos/bitnami-labs/sealed-secrets/releases/latest
    return_content: true
  register: kubeseal_latest

- name: Determine kubeseal version
  ansible.builtin.set_fact:
    kubeseal_ver: "{{ kubeseal_latest.json.tag_name | regex_replace('^v', '') }}"

- name: Download kubeseal
  ansible.builtin.unarchive:
    src: "https://github.com/bitnami-labs/sealed-secrets/releases/download/v{{ kubeseal_ver }}/kubeseal-{{ kubeseal_ver }}-linux-amd64.tar.gz"
    dest: ~/.local/bin
    extra_opts: kubeseal
    remote_src: true
    mode: "0700"
